name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches-ignore: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore CosmOrganizer.sln

      - name: Build
        run: dotnet build CosmOrganizer.sln -c Release --no-restore

      - name: Test
        run: dotnet test CosmOrganizer.sln -c Release --no-build
